# ============================================================================
# Semantic Search Backend - Kubernetes Deployment
# 使用 kubectl 单独部署，不在 Terraform 中管理
# ============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: semantic-search
  labels:
    app: semantic-search

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-search-config
  namespace: semantic-search
data:
  CSS_ENDPOINT: "PLACEHOLDER_CSS_ENDPOINT"
  MODELARTS_ENDPOINT: "modelarts.cn-north-4.myhuaweicloud.com"
  MAAS_ENDPOINT: "maas.cn-north-4.myhuaweicloud.com"
  PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-search-backend
  namespace: semantic-search
  labels:
    app: semantic-search-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: semantic-search-backend
  template:
    metadata:
      labels:
        app: semantic-search-backend
    spec:
      containers:
      - name: backend
        image: semantic-search-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: semantic-search-config
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: semantic-search-backend-service
  namespace: semantic-search
spec:
  selector:
    app: semantic-search-backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: semantic-search-backend-nodeport
  namespace: semantic-search
spec:
  selector:
    app: semantic-search-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  type: NodePort
