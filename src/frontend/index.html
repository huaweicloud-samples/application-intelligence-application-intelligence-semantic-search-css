<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语义搜索平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #1a1a1a;
            font-size: 32px;
            margin-bottom: 12px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .search-box {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 32px;
        }
        
        .search-input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .search-input {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #0070f3;
        }
        
        .search-btn {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: #0070f3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: #0051d5;
        }
        
        .search-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .search-options {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .option-group label {
            font-size: 14px;
            color: #666;
        }
        
        .option-group select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            outline: none;
        }
        
        .results {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }
        
        .results-count {
            font-size: 14px;
            color: #666;
        }
        
        .result-item {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #fafafa;
            transition: background 0.3s;
        }
        
        .result-item:hover {
            background: #f0f7ff;
        }
        
        .result-item:last-child {
            margin-bottom: 0;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        
        .result-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        
        .result-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #999;
        }
        
        .result-score {
            color: #00a854;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .error {
            padding: 16px;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            border-radius: 8px;
            color: #f5222d;
        }
        
        .chat-box {
            display: none;
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 32px;
        }
        
        .chat-box.active {
            display: block;
        }
        
        .chat-messages {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        
        .chat-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .chat-message.user {
            background: #e8f4ff;
            margin-left: 40px;
        }
        
        .chat-message.assistant {
            background: #f5f7fa;
            margin-right: 40px;
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 12px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .tab-btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            background: #fff;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #0070f3;
            border-color: #0070f3;
            background: #e8f4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 语义搜索平台</h1>
            <p>基于向量检索与 RAG 的智能搜索解决方案</p>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('search')">文档搜索</button>
            <button class="tab-btn" onclick="switchTab('chat')">智能问答</button>
        </div>
        
        <!-- 搜索模式 -->
        <div id="search-panel">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchQuery" 
                        placeholder="输入关键词或问题进行搜索..."
                        onkeypress="handleSearchKeypress(event)"
                    >
                    <button class="search-btn" onclick="performSearch()">搜索</button>
                </div>
                <div class="search-options">
                    <div class="option-group">
                        <label>搜索模式：</label>
                        <select id="searchType">
                            <option value="hybrid">混合搜索</option>
                            <option value="vector">向量搜索</option>
                            <option value="keyword">关键词搜索</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label>返回数量：</label>
                        <select id="topK">
                            <option value="3">3 条</option>
                            <option value="5" selected>5 条</option>
                            <option value="10">10 条</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="results" id="searchResults" style="display: none;">
                <div class="results-header">
                    <span class="results-count" id="resultsCount"></span>
                </div>
                <div id="resultsList"></div>
            </div>
        </div>
        
        <!-- 问答模式 -->
        <div id="chat-panel" style="display: none;">
            <div class="chat-box active">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-message assistant">
                        你好！我是智能问答助手，可以基于企业服务知识库回答你的问题。有什么可以帮你的吗？
                    </div>
                </div>
                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="chatQuery" 
                        placeholder="输入问题..."
                        onkeypress="handleChatKeypress(event)"
                    >
                    <button class="search-btn" onclick="performChat()">提问</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // API 配置 - 请替换为实际的 APIG 地址
        const API_BASE = '${API_BASE}';
        
        let currentTab = 'search';
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            document.getElementById('search-panel').style.display = tab === 'search' ? 'block' : 'none';
            document.getElementById('chat-panel').style.display = tab === 'chat' ? 'block' : 'none';
        }
        
        function handleSearchKeypress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }
        
        function handleChatKeypress(event) {
            if (event.key === 'Enter') {
                performChat();
            }
        }
        
        async function performSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;
            
            const searchType = document.getElementById('searchType').value;
            const topK = parseInt(document.getElementById('topK').value);
            
            const resultsList = document.getElementById('resultsList');
            const resultsDiv = document.getElementById('searchResults');
            
            resultsDiv.style.display = 'block';
            resultsList.innerHTML = '<div class="loading">搜索中...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        search_type: searchType,
                        top_k: topK
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.data);
                } else {
                    resultsList.innerHTML = `<div class="error">搜索失败: ${data.error}</div>`;
                }
            } catch (error) {
                resultsList.innerHTML = `<div class="error">请求失败: ${error.message}</div>`;
            }
        }
        
        function displayResults(results) {
            const resultsList = document.getElementById('resultsList');
            const resultsCount = document.getElementById('resultsCount');
            
            if (!results || results.length === 0) {
                resultsList.innerHTML = '<div class="loading">未找到相关结果</div>';
                resultsCount.textContent = '0 条结果';
                return;
            }
            
            resultsCount.textContent = `${results.length} 条结果`;
            
            resultsList.innerHTML = results.map((item, index) => `
                <div class="result-item">
                    <div class="result-title">${item.title || '无标题'}</div>
                    <div class="result-content">${item.content || '无内容'}</div>
                    <div class="result-meta">
                        <span>ID: ${item.id}</span>
                        <span class="result-score">相关性: ${(item.score * 100).toFixed(1)}%</span>
                    </div>
                </div>
            `).join('');
        }
        
        async function performChat() {
            const query = document.getElementById('chatQuery').value.trim();
            if (!query) return;
            
            const messagesDiv = document.getElementById('chatMessages');
            
            // 添加用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-message user';
            userMsg.textContent = query;
            messagesDiv.appendChild(userMsg);
            
            // 清空输入
            document.getElementById('chatQuery').value = '';
            
            // 添加助手消息占位
            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'chat-message assistant';
            assistantMsg.textContent = '思考中...';
            messagesDiv.appendChild(assistantMsg);
            
            // 滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: query,
                        top_k: 3
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    assistantMsg.textContent = data.answer;
                } else {
                    assistantMsg.textContent = `抱歉，发生错误: ${data.error}`;
                }
            } catch (error) {
                assistantMsg.textContent = `请求失败: ${error.message}`;
            }
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
